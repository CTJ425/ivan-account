name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk & wasm-opt
        run: |
          # Install Trunk binary
          curl -L -s https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          # Install wasm-opt binary
          curl -L -s https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz | sudo tar -xz --strip-components=2 -C /usr/local/bin binaryen-version_131/bin/wasm-opt

      - name: Build WASM application with Trunk
        run: trunk build --release

      - name: Ensure SPA fallback for Cloudflare Pages
        run: |
          # Verify _redirects exists for Cloudflare Pages SPA rewrite
          test -f dist/_redirects || cp _redirects dist/_redirects
          # Also supply 404.html as a fallback page
          cp dist/index.html dist/404.html

      - name: Setup Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=ivan-account --branch=main
